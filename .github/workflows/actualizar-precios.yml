name: Actualizar precios

# Corre el scraper, guarda el histórico en Supabase y abre/actualiza un Pull Request con data/prices.json.
# Al fusionar el PR en main, GitHub Pages / Vercel redespliega y la PWA queda con los precios nuevos.
on:
  schedule:
    # Lunes, miércoles y viernes a las 9:00 UTC (3:00 AM en Querétaro).
    # 3 ejecuciones semanales: suficiente para monitoreo de precios, no tiempo real.
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:
    inputs:
      solo:
        description: 'Correr un único adaptador (profeco | walmart | manual)'
        required: false
        type: string

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Correr el scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -n "${{ inputs.solo }}" ]; then
            node scraper/run.mjs --only "${{ inputs.solo }}"
          else
            node scraper/run.mjs
          fi

      - name: Validar el resultado antes de publicarlo
        run: npm run validate:prices

      - name: Correr las pruebas
        run: npm test

      - name: Generar token de GitHub App
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Crear o actualizar Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/actualizar-precios
          base: main
          title: 'chore(data): actualizar precios vigentes'
          commit-message: 'chore(data): actualiza precios vigentes'
          body: |
            Actualización automática periódica de precios en `data/prices.json`.

            - Generado por el scraper automatizado de SuperPrecios QRO.
            - Validado con `npm run validate:prices` y `npm test`.
          add-paths: |
            data/prices.json
          delete-branch: false
