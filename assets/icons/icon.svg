<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111d"/>
      <stop offset="100%" stop-color="#161e31"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing background circle -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Shopping Cart Base & Wheels -->
  <g transform="translate(10, 10)">
    <!-- Cart Body -->
    <path d="M120 150 L160 150 L200 310 L370 310 L410 200 L180 200" fill="none" stroke="url(#emeraldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Price Spark / Savings Lightning Tag -->
    <circle cx="280" cy="225" r="46" fill="#10b981" opacity="0.9"/>
    <text x="280" y="243" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">$</text>

    <!-- Wheels -->
    <circle cx="220" cy="370" r="24" fill="#34d399"/>
    <circle cx="350" cy="370" r="24" fill="#34d399"/>
    
    <circle cx="220" cy="370" r="10" fill="#0c111d"/>
    <circle cx="350" cy="370" r="10" fill="#0c111d"/>
  </g>
</svg>
